  schemas:
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationErrorBody:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Must be unique.
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UpdateProfileRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Must be unique among other users.
    StorePostRequest:
      type: object
      required: [title, category_id, content]
      properties:
        title:
          type: string
          maxLength: 255
        category_id:
          type: integer
          description: Must reference an active category.
        content:
          type: string
    UpdatePostRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 255
        category_id:
          type: integer
          description: Must reference an active category.
        content:
          type: string
        is_approved:
          type: boolean
          description: Admin only; ignored for regular users.
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Admin only; ignored for regular users.
    StoreCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Must be unique.
        is_active:
          type: boolean
          default: true
    UpdateCategoryRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 255
          description: Must be unique among other categories.
        is_active:
          type: boolean
    StoreCommentRequest:
      type: object
      required: [post_id, content]
      properties:
        post_id:
          type: integer
          description: Must reference a published post.
        content:
          type: string
          maxLength: 5000
    UpdateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 5000
    User:
      type: object
      required: [id, name, email, role, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        created_at:
          type: string
          format: date-time
          example: '2026-09-28T10:00:00+00:00'
    AuthSuccessResponse:
      type: object
      required: [message, user, token]
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: 'Plain text Sanctum token; send as `Authorization: Bearer {token}`.'
    Category:
      type: object
      required: [id, name, slug, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
    CategoryEnvelope:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/Category'
    Author:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
    Post:
      type: object
      required: [id, title, slug, content, is_approved, published_at, created_at, category, user]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
          description: Unique; generated from the title with -1, -2 ... suffixes on collision.
        content:
          type: string
        is_approved:
          type: boolean
        published_at:
          type: string
          nullable: true
          example: '2026-09-28 10:00:00'
        created_at:
          type: string
          example: '2026-09-28 10:00:00'
        category:
          $ref: '#/components/schemas/Category'
        user:
          $ref: '#/components/schemas/Author'
    PostWithComments:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          required: [comments]
          properties:
            comments:
              type: array
              description: Approved comments only.
              items:
                $ref: '#/components/schemas/Comment'
    PostEnvelope:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/Post'
    Comment:
      type: object
      required: [id, content, is_approved, created_at, user]
      properties:
        id:
          type: integer
        content:
          type: string
        is_approved:
          type: boolean
        created_at:
          type: string
          example: '2026-09-28 10:00:00'
        user:
          $ref: '#/components/schemas/Author'
    CommentEnvelope:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/Comment'
    Contract:
      type: object
      required: [id, title, slug, content, is_active, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
    PaginationMetaLink:
      type: object
      required: [url, label, active]
      properties:
        url:
          type: string
          nullable: true
        label:
          type: string
          description: Page number, or the framework's previous/next labels.
        page:
          type: integer
          nullable: true
        active:
          type: boolean
    PaginationMeta:
      type: object
      required: [current_page, from, last_page, links, path, per_page, to, total]
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginationMetaLink'
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer
    PaginatedPosts:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginatedCategories:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
