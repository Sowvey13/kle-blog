name: kle-blog

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kle_blog}
      MYSQL_USER: ${MYSQL_USER:-kle_blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - kle-blog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - kle-blog

  backend:
    build:
      context: ./kle-blog-backend
    restart: unless-stopped
    volumes:
      - ./kle-blog-backend:/var/www
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-kle_blog}
      DB_USERNAME: ${MYSQL_USER:-kle_blog}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kle-blog

  frontend:
    build:
      context: ./kle-blog-frontend
    restart: unless-stopped
    volumes:
      - ./kle-blog-frontend:/var/www
    ports:
      - "${FRONTEND_PORT:-8080}:8000"
    environment:
      APP_URL: http://localhost:${FRONTEND_PORT:-8080}
      BACKEND_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - kle-blog

volumes:
  kle-blog-mysql-data:

networks:
  kle-blog:
    driver: bridge
