openapi: 3.0.3
info:
  title: KLE Blog API
  version: 1.1.0
  description: |
    KLE Blog backend REST API.

    Every request must send `Accept: application/json`; requests with a body also send
    `Content-Type: application/json`. Protected operations additionally require
    `Authorization: Bearer {token}` where the token comes from `/login` or `/register`.

    Public read endpoints only expose published content: approved posts whose
    `published_at` is in the past and whose category is active. Inactive categories
    and inactive contracts respond with 404.

    Paginated endpoints accept `page` (>= 1) and `per_page` (1-50). Values outside that
    range return 422. Pages beyond `meta.last_page` return an empty `data` array.
servers:
  - url: http://localhost:8000/api
    description: Local Docker backend
tags:
  - name: Auth
    description: Registration, login and token revocation.
  - name: Profile
    description: Authenticated user profile and own posts.
  - name: Posts
    description: Published posts and author post management.
  - name: Categories
    description: Category browsing and admin management.
  - name: Comments
    description: Comment creation and moderation.
  - name: Contracts
    description: Public legal contracts.

paths:
  /register:
    post:
      operationId: register
      security: []
      tags: [Auth]
      summary: Register a user and issue a token
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Ayşe Yılmaz
              email: ayse@example.com
              password: password123
              password_confirmation: password123
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                message: Kayıt başarılı.
                user:
                  id: 2
                  name: Ayşe Yılmaz
                  email: ayse@example.com
                  role: user
                  created_at: '2026-09-28T10:00:00+00:00'
                token: 2|p3QeX...
        '422':
          $ref: '#/components/responses/ValidationError'

  /login:
    post:
      operationId: login
      security: []
      tags: [Auth]
      summary: Login and receive a Sanctum token
      description: Rate limited to 6 attempts per minute per client (`throttle:6,1`). The 7th attempt returns 429 even with valid credentials.
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: password
      responses:
        '200':
          description: Authenticated
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                message: Giriş başarılı.
                user:
                  id: 1
                  name: Admin
                  email: admin@example.com
                  role: admin
                  created_at: '2026-09-28T10:00:00+00:00'
                token: 1|a8Kd2...
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Geçersiz e-posta veya şifre.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the current access token
      description: Only the token used for this request is deleted. Tokens issued to other devices stay valid. Reusing the revoked token returns 401.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Oturum kapatıldı.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me:
    get:
      operationId: getMe
      tags: [Profile]
      summary: Current authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Current authenticated user (alias of GET /me)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      operationId: updateProfile
      tags: [Profile]
      summary: Update profile name and email
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: Ayşe Kaya
              email: ayse.kaya@example.com
      responses:
        '200':
          $ref: '#/components/responses/ProfileUpdated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      operationId: patchProfile
      tags: [Profile]
      summary: Update profile name and email
      description: Same contract as PUT; both `name` and `email` are required.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProfileUpdated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /my-posts:
    get:
      operationId: listMyPosts
      tags: [Profile]
      summary: Posts owned by the authenticated user
      description: Includes pending and unpublished posts. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPageDefault10'
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /posts:
    get:
      operationId: listPosts
      security: []
      tags: [Posts]
      summary: List published posts
      description: All filters can be combined; they are applied with AND semantics.
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPageDefault15'
        - name: search
          in: query
          description: Matches title or content.
          schema:
            type: string
            maxLength: 255
        - name: category_id
          in: query
          description: Must reference an existing category.
          schema:
            type: integer
        - name: user_id
          in: query
          description: Must reference an existing user.
          schema:
            type: integer
        - name: date
          in: query
          description: Matches the post creation date.
          schema:
            type: string
            format: date
            example: '2026-09-28'
      responses:
        '200':
          description: Paginated published posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createPost
      tags: [Posts]
      summary: Create a post (pending approval)
      description: The slug is generated from the title and suffixed with -1, -2 ... on collision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePostRequest'
            example:
              title: Laravel 13 ile API Tasarımı
              category_id: 1
              content: En az birkaç cümlelik içerik.
      responses:
        '201':
          description: Created, waiting for admin approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostEnvelope'
              example:
                message: Yazınız oluşturuldu ve onay için admin onayına gönderildi.
                data:
                  id: 12
                  title: Laravel 13 ile API Tasarımı
                  slug: laravel-13-ile-api-tasarimi
                  content: En az birkaç cümlelik içerik.
                  is_approved: false
                  published_at: null
                  created_at: '2026-09-28 10:00:00'
                  category:
                    id: 1
                    name: Yazılım
                    slug: yazilim
                    is_active: true
                  user:
                    id: 2
                    name: Ayşe Yılmaz
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /posts/{post}:
    parameters:
      - $ref: '#/components/parameters/AcceptJson'
    get:
      operationId: showPost
      security: []
      tags: [Posts]
      summary: Show a published post by slug
      parameters:
        - name: post
          in: path
          required: true
          description: Post slug.
          schema:
            type: string
            example: laravel-13-ile-api-tasarimi
      responses:
        '200':
          description: Post with approved comments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PostWithComments'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePost
      tags: [Posts]
      summary: Update a post by id
      description: |
        Owner or admin only. Changing the title regenerates a unique slug.
        When a regular user updates, `is_approved` becomes false and `published_at` becomes null.
        `is_approved` and `published_at` are honored only for admins.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          $ref: '#/components/responses/PostUpdated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      operationId: patchPost
      tags: [Posts]
      summary: Partially update a post by id
      description: Same rules as PUT; omitted fields are left unchanged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
            example:
              title: Güncellenmiş Başlık
      responses:
        '200':
          $ref: '#/components/responses/PostUpdated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deletePost
      tags: [Posts]
      summary: Delete a post by id
      description: Owner or admin only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Yazı silindi.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      operationId: listCategories
      security: []
      tags: [Categories]
      summary: List active categories
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPageDefault10'
      responses:
        '200':
          description: Paginated active categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategories'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Create a category (admin only)
      description: The slug is generated from the name and suffixed with -1, -2 ... on collision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCategoryRequest'
            example:
              name: Yapay Zeka
              is_active: true
      responses:
        '201':
          $ref: '#/components/responses/CategoryCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /categories/{category}:
    parameters:
      - $ref: '#/components/parameters/AcceptJson'
    get:
      operationId: showCategory
      security: []
      tags: [Categories]
      summary: Category detail with its published posts
      description: Inactive or unknown categories return 404. Posts are paginated under `posts` using the standard `data`, `links`, `meta` envelope.
      parameters:
        - name: category
          in: path
          required: true
          description: Category slug.
          schema:
            type: string
            example: yazilim
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPageDefault15'
      responses:
        '200':
          description: Category and paginated posts
          content:
            application/json:
              schema:
                type: object
                required: [category, posts]
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
                  posts:
                    $ref: '#/components/schemas/PaginatedPosts'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      operationId: updateCategory
      tags: [Categories]
      summary: Update a category by id (admin only)
      description: Renaming regenerates a unique slug. Authorization is checked before validation, so non-admins always receive 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
            example:
              name: Yazılım Geliştirme
              is_active: false
      responses:
        '200':
          $ref: '#/components/responses/CategoryUpdated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      operationId: patchCategory
      tags: [Categories]
      summary: Partially update a category by id (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
            example:
              is_active: false
      responses:
        '200':
          $ref: '#/components/responses/CategoryUpdated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteCategory
      tags: [Categories]
      summary: Delete a category by id (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Kategori silindi.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments:
    post:
      operationId: createComment
      tags: [Comments]
      summary: Comment on a published post
      description: The comment is stored with `is_approved=false`. Unpublished, scheduled or inactive-category posts are rejected with 422.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCommentRequest'
            example:
              post_id: 12
              content: Çok faydalı bir yazı olmuş.
      responses:
        '201':
          description: Comment created, pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEnvelope'
              example:
                message: Yorumunuz alındı, admin onayından sonra yayınlanacaktır.
                data:
                  id: 5
                  content: Çok faydalı bir yazı olmuş.
                  is_approved: false
                  created_at: '2026-09-28 10:00:00'
                  user:
                    id: 2
                    name: Ayşe Yılmaz
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /comments/{comment}:
    parameters:
      - $ref: '#/components/parameters/AcceptJson'
      - $ref: '#/components/parameters/CommentId'
    put:
      operationId: updateComment
      tags: [Comments]
      summary: Update a comment
      description: Owner or admin only; other users receive 403. A comment edited by its non-admin owner returns to `is_approved=false`; admin edits keep the current approval.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
            example:
              content: Düzenlenmiş yorum metni.
      responses:
        '200':
          $ref: '#/components/responses/CommentUpdated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      operationId: patchComment
      tags: [Comments]
      summary: Update a comment
      description: Same contract as PUT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommentUpdated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteComment
      tags: [Comments]
      summary: Delete a comment
      description: Owner or admin only; other users receive 403.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Yorum silindi.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /contracts:
    get:
      operationId: listContracts
      security: []
      tags: [Contracts]
      summary: List active contracts
      description: Not paginated; ordered by title. Inactive contracts are never listed.
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      responses:
        '200':
          description: Contract collection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'

  /contracts/{slug}:
    get:
      operationId: showContract
      security: []
      tags: [Contracts]
      summary: Show an active contract
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: kullanici-sozlesmesi
      responses:
        '200':
          description: Contract
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Contract'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: 'Send `Authorization: Bearer {token}`.'

  headers:
    RateLimitLimit:
      schema:
        type: integer
        example: 6
    RateLimitRemaining:
      schema:
        type: integer
        example: 5
    RetryAfter:
      description: Seconds until the next attempt is allowed.
      schema:
        type: integer
        example: 60

  parameters:
    AcceptJson:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum: [application/json]
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageDefault10:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    PerPageDefault15:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 15
    PostId:
      name: post
      in: path
      required: true
      description: Numeric post id.
      schema:
        type: integer
    CategoryId:
      name: category
      in: path
      required: true
      description: Numeric category id.
      schema:
        type: integer
    CommentId:
      name: comment
      in: path
      required: true
      description: Numeric comment id.
      schema:
        type: integer

  responses:
    Unauthenticated:
      description: Missing, invalid or revoked token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: This action is unauthorized.
    NotFound:
      description: Resource not found or not publicly visible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
          example:
            message: The per page field must not be greater than 50.
            errors:
              per_page:
                - The per page field must not be greater than 50.
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Too Many Attempts.
    UserResponse:
      description: User resource
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/User'
    ProfileUpdated:
      description: Updated
      content:
        application/json:
          schema:
            type: object
            required: [data, message]
            properties:
              data:
                $ref: '#/components/schemas/User'
              message:
                type: string
                example: Profil bilgileriniz başarıyla güncellendi.
    PostUpdated:
