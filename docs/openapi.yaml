openapi: 3.0.3
info:
  title: KLE Blog API
  version: 1.0.0
  description: |
    KLE Blog backend REST API. Public endpoints return published content only.
    Authenticated routes require `Authorization: Bearer {token}` from login or register.
  contact:
    name: KLE Blog
servers:
  - url: http://localhost:8000/api
    description: Local Docker backend
tags:
  - name: Auth
  - name: Profile
  - name: Posts
  - name: Categories
  - name: Comments
  - name: Contracts

paths:
  /register:
    post:
      tags: [Auth]
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Ayşe Yılmaz
              email: ayse@example.com
              password: password123
              password_confirmation: password123
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /login:
    post:
      tags: [Auth]
      summary: Login and receive a Sanctum token
      description: Throttled to 6 attempts per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Geçersiz e-posta veya şifre.
        '429':
          description: Too many attempts
        '422':
          $ref: '#/components/responses/ValidationError'

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me:
    get:
      tags: [Profile]
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /profile:
    get:
      tags: [Profile]
      summary: Alias of GET /me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [Profile]
      summary: Update profile name and email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Profile]
      summary: Partial profile update
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /my-posts:
    get:
      tags: [Posts]
      summary: Authenticated user's posts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /posts:
    get:
      tags: [Posts]
      summary: List published posts
      description: |
        Only approved posts with `published_at <= now()` in an active category are returned.
        Posts belonging to inactive categories are excluded from list and search.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 255
        - name: category_id
          in: query
          schema:
            type: integer
        - name: user_id
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated published posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPosts'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Posts]
      summary: Create a post (pending approval)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePostRequest'
            example:
              title: Laravel 13 ile API Tasarımı
              category_id: 1
              content: En az birkaç cümlelik içerik.
      responses:
        '201':
          description: Created, waiting for admin approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Validation failed (inactive category, missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'

  /posts/{slug}:
    get:
      tags: [Posts]
      summary: Show a published post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post with approved comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{post}:
    put:
      tags: [Posts]
      summary: Update a post by id
      description: Owner or admin. Regular users reset `is_approved` to false and `published_at` to null.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Posts]
      summary: Partial post update
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Posts]
      summary: Delete a post by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories:
    get:
      tags: [Categories]
      summary: List active categories
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Paginated active categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategories'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Categories]
      summary: Create a category (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                is_active:
                  type: boolean
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /categories/{slug}:
    get:
      tags: [Categories]
      summary: Category detail with published posts
      description: Inactive categories return 404. Response body uses `category` and `posts.data`.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Category and paginated posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
                  posts:
                    $ref: '#/components/schemas/PaginatedPosts'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories/{category}:
    put:
      tags: [Categories]
      summary: Update a category (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Updated
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Categories]
      summary: Delete a category (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /comments:
    post:
      tags: [Comments]
      summary: Create a comment on a published post
      description: Unpublished or scheduled posts are rejected with 422.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id, content]
              properties:
                post_id:
                  type: integer
                content:
                  type: string
      responses:
        '201':
          description: Comment created, pending approval
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /comments/{comment}:
    delete:
      tags: [Comments]
      summary: Delete a comment
      security:
        - bearerAuth: []
      parameters:
        - name: comment
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contracts:
    get:
      tags: [Contracts]
      summary: List active contracts
      responses:
        '200':
          description: Contract collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'

  /contracts/{slug}:
    get:
      tags: [Contracts]
      summary: Show an active contract
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Contract'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: `Authorization: Bearer {token}`

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Maximum 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 15
    PostId:
      name: post
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ValidationErrorBody:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UpdateProfileRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    StorePostRequest:
      type: object
      required: [title, category_id, content]
      properties:
        title:
          type: string
        category_id:
          type: integer
        content:
          type: string
    UpdatePostRequest:
      type: object
      properties:
        title:
          type: string
        category_id:
          type: integer
        content:
          type: string
        is_approved:
          type: boolean
          description: Honored only for admin users
        published_at:
          type: string
          format: date-time
          nullable: true
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        created_at:
          type: string
    AuthSuccessResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        is_approved:
          type: boolean
        created_at:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        is_approved:
          type: boolean
        created_at:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
    Contract:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
    PaginatedPosts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginatedCategories:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
